<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img"
     aria-label="OneDress animated icon: five skin-tone dots appear, converge, and one dress draws itself in and fills with the rose-to-sage winning colorway.">
  <defs>
    <linearGradient id="gownGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#D98BA3"/>
      <stop offset="55%" stop-color="#D98BA3" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#9CAF88"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D98BA3" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#D9B98C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9CAF88" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1019"/>
      <stop offset="100%" stop-color="#120910"/>
    </linearGradient>
    <radialGradient id="roseAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#D98BA3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D98BA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sageAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9CAF88" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9CAF88" stop-opacity="0"/>
    </radialGradient>
    <filter id="breathBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="plateClip">
      <rect x="24" y="24" width="464" height="464" rx="116"/>
    </clipPath>
    <style>
      .an-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: 6s cubic-bezier(.2,1.4,.4,1) infinite;
      }
      .d1 { animation-name: pop1; }
      .d2 { animation-name: pop2; }
      .d3 { animation-name: pop3; }
      .d4 { animation-name: pop4; }
      .d5 { animation-name: pop5; }
      @keyframes pop1 { 0%,4%   { transform: scale(0); } 8%    { transform: scale(1.18); } 10.5%,100% { transform: scale(1); } }
      @keyframes pop2 { 0%,6.5% { transform: scale(0); } 10.5% { transform: scale(1.18); } 13%,100%   { transform: scale(1); } }
      @keyframes pop3 { 0%,9%   { transform: scale(0); } 13%   { transform: scale(1.18); } 15.5%,100% { transform: scale(1); } }
      @keyframes pop4 { 0%,11.5%{ transform: scale(0); } 15.5% { transform: scale(1.18); } 18%,100%   { transform: scale(1); } }
      @keyframes pop5 { 0%,14%  { transform: scale(0); } 18%   { transform: scale(1.18); } 20.5%,100% { transform: scale(1); } }
      .spark {
        transform-box: fill-box;
        transform-origin: center;
        animation: 6s cubic-bezier(.2,1.4,.4,1) infinite;
      }
      .s1 { animation-name: spark1; }
      .s2 { animation-name: spark2; }
      @keyframes spark1 { 0%,57% { transform: scale(0) rotate(-40deg); } 61.5% { transform: scale(1.25) rotate(8deg); } 64%,100% { transform: scale(1) rotate(0deg); } }
      @keyframes spark2 { 0%,61% { transform: scale(0) rotate(-40deg); } 65.5% { transform: scale(1.2) rotate(8deg); }  68%,100% { transform: scale(1) rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Static base: plate + ambient -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#plateGrad)"/>
  <g clip-path="url(#plateClip)">
    <circle cx="120" cy="96" r="220" fill="url(#roseAmbient)"/>
    <circle cx="408" cy="428" r="230" fill="url(#sageAmbient)"/>
  </g>
  <rect x="25" y="25" width="462" height="462" rx="115" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Story layer: loop-fades so the restart never hard-cuts -->
  <g>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;0.02;0.96;1"/>

    <!-- Party arc fades in -->
    <path d="M127,135 A210,210 0 0 1 385,135" fill="none" stroke="#D9B98C" stroke-opacity="0.3"
          stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               values="0;0;1;1" keyTimes="0;0.04;0.14;1"/>
    </path>

    <!-- Five bridesmaids pop in -->
    <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
      <circle class="an-dot d1" cx="127" cy="135" r="17" fill="#F3DCC9"/>
      <circle class="an-dot d2" cx="188" cy="101" r="17" fill="#E9BE9B"/>
      <circle class="an-dot d3" cx="256" cy="90"  r="17" fill="#CE9268"/>
      <circle class="an-dot d4" cx="324" cy="101" r="17" fill="#9A6844"/>
      <circle class="an-dot d5" cx="385" cy="135" r="17" fill="#5F3B27"/>
    </g>

    <!-- Convergence hairlines draw in, staggered -->
    <g stroke="#D98BA3" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round" fill="none">
      <line x1="131" y1="151" x2="242" y2="164" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.18;0.28;1"/>
      </line>
      <line x1="191" y1="118" x2="248" y2="160" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.2;0.3;1"/>
      </line>
      <line x1="256" y1="107" x2="256" y2="158" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.22;0.32;1"/>
      </line>
      <line x1="321" y1="118" x2="264" y2="160" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.24;0.34;1"/>
      </line>
      <line x1="381" y1="151" x2="270" y2="164" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.26;0.36;1"/>
      </line>
    </g>

    <!-- Glow breath (blurred gown duplicate) -->
    <path d="M222,172 C244,163 268,163 290,172 C288,200 286,228 282,254 C306,300 342,352 358,406 Q256,438 154,406 C170,352 206,300 230,254 C226,228 224,200 222,172 Z"
          fill="url(#gownGrad)" opacity="0" filter="url(#breathBlur)">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               values="0;0;0.5;0.22;0.5;0.22;0" keyTimes="0;0.5;0.62;0.74;0.86;0.94;1"/>
    </path>

    <!-- The dress draws itself in… -->
    <path d="M222,172 C244,163 268,163 290,172 C288,200 286,228 282,254 C306,300 342,352 358,406 Q256,438 154,406 C170,352 206,300 230,254 C226,228 224,200 222,172 Z"
          fill="none" stroke="url(#gownGrad)" stroke-width="4" stroke-linecap="round"
          pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.22;0.42;1"/>
      <animate attributeName="stroke-opacity" dur="6s" repeatCount="indefinite"
               values="1;1;0.55;0.55" keyTimes="0;0.44;0.54;1"/>
    </path>

    <!-- …then fills with the winning colorway (signature moment, mid-loop) -->
    <path d="M222,172 C244,163 268,163 290,172 C288,200 286,228 282,254 C306,300 342,352 358,406 Q256,438 154,406 C170,352 206,300 230,254 C226,228 224,200 222,172 Z"
          fill="url(#gownGrad)" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               values="0;0;1;1" keyTimes="0;0.40;0.54;1"/>
    </path>

    <!-- Champagne waist seam draws -->
    <path d="M228,251 Q256,263 284,251" fill="none" stroke="#D9B98C" stroke-width="5" stroke-linecap="round"
          opacity="0.9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite"
               values="100;100;0;0" keyTimes="0;0.52;0.6;1"/>
    </path>

    <!-- Sparkles pop (outer g positions; inner path carries the CSS transform animation) -->
    <g fill="#D9B98C">
      <g transform="translate(316,322)">
        <path class="spark s1" d="M0,-12 C1.5,-3 3,-1.5 12,0 C3,1.5 1.5,3 0,12 C-1.5,3 -3,1.5 -12,0 C-3,-1.5 -1.5,-3 0,-12 Z" opacity="0.95"/>
      </g>
      <g transform="translate(196,346) scale(0.55)">
        <path class="spark s2" d="M0,-12 C1.5,-3 3,-1.5 12,0 C3,1.5 1.5,3 0,12 C-1.5,3 -3,1.5 -12,0 C-3,-1.5 -1.5,-3 0,-12 Z" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
