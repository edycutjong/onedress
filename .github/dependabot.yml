version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # ── Submission freeze, until judging closes (2026-08-17) ──────────────
    # 0 disables *version* updates only. Dependabot security updates are a
    # separate feature and keep flowing, so real advisories still open PRs —
    # we just stop the weekly churn of bumps that fix nothing. Restore to 10
    # after judging.
    #
    # Earned the hard way: with version updates on, Dependabot offered
    # typescript 5.9.3 and prettier 3.9.6. `npm run ci` gates on `tsc --noEmit`
    # and `prettier --check`, so both turn the pipeline red for zero security
    # gain — typescript 5.9.3 did exactly that on run 31309800557.
    open-pull-requests-limit: 0
    # Majors stay out even when an advisory suggests one. `npm audit` wanted
    # next 16 for the postcss chain; that chain is instead pinned via
    # `overrides` in package.json, which fixes it without the migration.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
