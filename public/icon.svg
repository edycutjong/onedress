<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OneDress icon: five skin-tone dots converging on one rose-to-sage gradient dress">
  <defs>
    <!-- Brand gradient — var() wins when _tokens.css is loaded; hex fallback when rasterized standalone -->
    <linearGradient id="gownGrad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="var(--primary, #D98BA3)"/>
      <stop offset="55%" stop-color="var(--primary, #D98BA3)" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="var(--accent, #9CAF88)"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="var(--primary, #D98BA3)" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="var(--tertiary, #D9B98C)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--accent, #9CAF88)" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1019"/>
      <stop offset="100%" stop-color="#120910"/>
    </linearGradient>
    <radialGradient id="roseAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="var(--primary, #D98BA3)" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="var(--primary, #D98BA3)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sageAmbient" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="var(--accent, #9CAF88)" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="var(--accent, #9CAF88)" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="plateClip">
      <rect x="24" y="24" width="464" height="464" rx="116"/>
    </clipPath>
  </defs>

  <!-- Plate -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#plateGrad)"/>
  <g clip-path="url(#plateClip)">
    <circle cx="120" cy="96" r="220" fill="url(#roseAmbient)"/>
    <circle cx="408" cy="428" r="230" fill="url(#sageAmbient)"/>
  </g>
  <rect x="25" y="25" width="462" height="462" rx="115" fill="none" stroke="url(#rimGrad)" stroke-width="2"/>

  <!-- Party arc: five bridesmaids, five skin tones -->
  <path d="M127,135 A210,210 0 0 1 385,135" fill="none" stroke="var(--tertiary, #D9B98C)" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="1 8" stroke-linecap="round"/>
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <circle cx="127" cy="135" r="17" fill="var(--tone-1, #F3DCC9)"/>
    <circle cx="188" cy="101" r="17" fill="var(--tone-2, #E9BE9B)"/>
    <circle cx="256" cy="90"  r="17" fill="var(--tone-3, #CE9268)"/>
    <circle cx="324" cy="101" r="17" fill="var(--tone-4, #9A6844)"/>
    <circle cx="385" cy="135" r="17" fill="var(--tone-5, #5F3B27)"/>
  </g>

  <!-- Convergence: five tones, one dress -->
  <g stroke="var(--primary, #D98BA3)" stroke-opacity="0.22" stroke-width="1.5" stroke-linecap="round">
    <line x1="131" y1="151" x2="242" y2="164"/>
    <line x1="191" y1="118" x2="248" y2="160"/>
    <line x1="256" y1="107" x2="256" y2="158"/>
    <line x1="321" y1="118" x2="264" y2="160"/>
    <line x1="381" y1="151" x2="270" y2="164"/>
  </g>

  <!-- The one dress: glow layer then gown -->
  <path d="M222,172 C244,163 268,163 290,172 C288,200 286,228 282,254 C306,300 342,352 358,406 Q256,438 154,406 C170,352 206,300 230,254 C226,228 224,200 222,172 Z"
        fill="url(#gownGrad)" opacity="0.55" filter="url(#softGlow)"/>
  <path d="M222,172 C244,163 268,163 290,172 C288,200 286,228 282,254 C306,300 342,352 358,406 Q256,438 154,406 C170,352 206,300 230,254 C226,228 224,200 222,172 Z"
        fill="url(#gownGrad)"/>

  <!-- Champagne waist seam -->
  <path d="M228,251 Q256,263 284,251" fill="none" stroke="var(--tertiary, #D9B98C)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Sparkles -->
  <g fill="var(--tertiary, #D9B98C)">
    <path transform="translate(316,322)" d="M0,-12 C1.5,-3 3,-1.5 12,0 C3,1.5 1.5,3 0,12 C-1.5,3 -3,1.5 -12,0 C-3,-1.5 -1.5,-3 0,-12 Z" opacity="0.95"/>
    <path transform="translate(196,346) scale(0.55)" d="M0,-12 C1.5,-3 3,-1.5 12,0 C3,1.5 1.5,3 0,12 C-1.5,3 -3,1.5 -12,0 C-3,-1.5 -1.5,-3 0,-12 Z" opacity="0.7"/>
  </g>
</svg>
